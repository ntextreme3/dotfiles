[tools]
node = "lts"
go = "latest"
fzf = "latest"
delta = "latest"
starship = "latest"
bat = "latest"
fd = "latest"
ripgrep = "latest"
jq = "latest"
yq = "latest"
kubectl = "latest"
kubectx = "latest"
jqp = "latest"

[settings]
# Same policy as the release-delayed chezmoi externals: give a compromised
# release time to be pulled before it's installed.
minimum_release_age = "7d"
# chezmoi installs and updates mise itself, so `mise self-update` nags are noise.
disable_update_warning = true
