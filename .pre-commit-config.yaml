repos:
  - repo: local
    hooks:
      - id: bats
        name: bats
        # node: prek manages its own Node + pinned bats, so the hook doesn't
        # depend on nvm being on PATH (e.g. GUI git clients)
        language: node
        additional_dependencies: ["bats@1.13.0"]
        entry: bats tests/
        files: ^(dot_bashrc\.d/|tests/)
        pass_filenames: false
